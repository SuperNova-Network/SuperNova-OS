# Fly.io configuration. Deploy with `fly deploy`.
# Docs: https://fly.io/docs/reference/configuration/

app = 'supernova-os'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  # Fly's proxy sits in front of the app: trust it for the visitor's address.
  TRUST_PROXY = '1'

# Accounts (ACCOUNTS=1) need a volume for their database:
#   fly volumes create supernova_data --size 1
# [mounts]
#   source = 'supernova_data'
#   destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
